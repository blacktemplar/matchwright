<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1568 784" width="1568" height="784">
  <!-- the repository's social preview, uploaded in GitHub's settings (General → Social preview),
       rendered with Noto Sans installed:
       rsvg-convert -w 1568 -h 784 social-preview.svg -o social-preview.png -->
  <style>
    text { font-family: "Noto Sans"; fill: #1f2328; }
    .name { font-size: 92px; font-weight: 700; }
    .tagline { font-size: 37px; }
    .feature { font-size: 28px; fill: #5f6670; }
    .title { font-size: 26px; font-weight: 700; }
    .round { font-size: 20px; font-weight: 700; fill: #5f6670; }
    .number { font-size: 20px; fill: #5f6670; text-anchor: middle; }
    .entrant { font-size: 22px; }
    .winner { font-weight: 700; }
    .check { fill: #1f4e79; font-weight: 700; }
    .open { fill: #1f4e79; text-decoration: underline; }
    .played { fill: #f3f4f6; stroke: #cfd4da; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .next { fill: #fff; stroke: #cfd4da; stroke-width: 1.5; }
    .line { fill: none; stroke: #8a929b; stroke-width: 1.5; }
  </style>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#1f2328" flood-opacity="0.12"/>
    </filter>
    <clipPath id="icon-corners"><rect width="512" height="512" rx="88"/></clipPath>
  </defs>
  <rect width="1568" height="784" fill="#f3f4f6"/>

  <!-- the icon, as in tournament-gui/public/icon.svg -->
  <g transform="translate(78 140) scale(0.27)" clip-path="url(#icon-corners)">
    <rect width="512" height="512" fill="#1f4e79"/>
    <path d="M96 160H176V224H96M176 192H248M96 288H176V352H96M176 320H248M248 192V320M248 256H320"
          fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M370 150L300 270H346L322 362L404 232H356L384 150Z" fill="#f2b705"
          stroke="#f2b705" stroke-width="8" stroke-linejoin="round"/>
  </g>
  <text class="name" x="74" y="392">Tournamo</text>
  <text class="tagline" x="78" y="455">Run a tournament</text>
  <text class="tagline" x="78" y="504">in your browser.</text>
  <text class="feature" x="78" y="577">Round robin · knockouts · Monster DYP</text>
  <text class="feature" x="78" y="625">Offline · no account · no tracking</text>

  <!-- the bracket card -->
  <rect x="703" y="75" width="770" height="633" rx="14" fill="#fff" stroke="#e3e6ea" filter="url(#shadow)"/>
  <text class="title" x="726" y="126">Club Championship 2026</text>
  <text class="round" x="726" y="175">Quarterfinals</text>
  <text class="round" x="978" y="175">Semifinals</text>
  <text class="round" x="1231" y="175">Final</text>
  <text class="round" x="1231" y="536">Third place</text>

  <path class="line" d="M945 239H961V330H945M961 284.5H978M945 419H961V510H945M961 464.5H978"/>
  <path class="line" d="M1197 284.5H1213V464.5H1197M1213 374.5H1231"/>

  <rect class="played" x="726" y="200" width="219" height="78" rx="6"/>
  <text class="number" x="754" y="246">1</text>
  <text class="entrant" x="772" y="229"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Sofia Haas</tspan></text>
  <text class="entrant" x="772" y="262">Noah Fischer</text>

  <rect class="played" x="726" y="291" width="219" height="78" rx="6"/>
  <text class="number" x="754" y="337">2</text>
  <text class="entrant" x="772" y="320">Jonas Keller</text>
  <text class="entrant" x="772" y="353"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Mia Novak</tspan></text>

  <rect class="played" x="726" y="380" width="219" height="78" rx="6"/>
  <text class="number" x="754" y="426">3</text>
  <text class="entrant" x="772" y="409"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Elias Wolf</tspan></text>
  <text class="entrant" x="772" y="442">Lena Brandt</text>

  <rect class="played" x="726" y="471" width="219" height="78" rx="6"/>
  <text class="number" x="754" y="517">4</text>
  <text class="entrant" x="772" y="500">Luca Rossi</text>
  <text class="entrant" x="772" y="533"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Anna Berger</tspan></text>

  <rect class="played" x="978" y="245" width="219" height="78" rx="6"/>
  <text class="number" x="1006" y="291">5</text>
  <text class="entrant" x="1024" y="274">Sofia Haas</text>
  <text class="entrant" x="1024" y="307"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Mia Novak</tspan></text>

  <rect class="played" x="978" y="425" width="219" height="78" rx="6"/>
  <text class="number" x="1006" y="471">6</text>
  <text class="entrant" x="1024" y="454"><tspan class="check">✓</tspan><tspan class="winner" dx="7">Elias Wolf</tspan></text>
  <text class="entrant" x="1024" y="487">Anna Berger</text>

  <rect class="next" x="1231" y="335" width="219" height="78" rx="6"/>
  <text class="number" x="1259" y="381">7</text>
  <text class="entrant open" x="1277" y="364">Mia Novak</text>
  <text class="entrant open" x="1277" y="397">Elias Wolf</text>

  <rect class="next" x="1231" y="555" width="219" height="78" rx="6"/>
  <text class="number" x="1259" y="601">8</text>
  <text class="entrant open" x="1277" y="584">Anna Berger</text>
  <text class="entrant open" x="1277" y="617">Sofia Haas</text>
</svg>
