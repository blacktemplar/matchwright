[package]
name = "tournament-gui"
description = "The GUI for running tournaments, in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["web"] }
tournament-app.workspace = true
tournament-engine.workspace = true
# the languages the browser prefers, the one chosen, and the page's `<html lang>`
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "Navigator",
    "Storage",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# seeds and ids are random, and in the browser randomness comes from JavaScript
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
