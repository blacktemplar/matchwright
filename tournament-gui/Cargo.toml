[package]
name = "tournament-gui"
description = "The GUI for running tournaments, in the browser"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
dioxus = { workspace = true, features = ["web"] }
dioxus-icons.workspace = true
dioxus-primitives.workspace = true
futures-util.workspace = true
# the browser's offer to install the page, which `public/pwa.js` keeps
js-sys.workspace = true
tournament-app.workspace = true
tournament-browser.workspace = true
tournament-engine.workspace = true
wasm-bindgen.workspace = true
# the languages the browser prefers, the one chosen, the page's `<html lang>`, the competition
# open, after the `#` of its URL, and the keys and pointers closing the toggletips
web-sys = { workspace = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "KeyboardEvent",
    "Location",
    "Navigator",
    "Storage",
    "Window",
] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# seeds and ids are random, and in the browser randomness comes from JavaScript
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test.workspace = true
