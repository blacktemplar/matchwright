repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo +nightly fmt --all
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      # the crates that also run in the browser; its configuration rejects a test the wasm test
      # runner would skip
      - id: cargo-clippy-wasm
        name: cargo clippy (wasm)
        entry: env CLIPPY_CONF_DIR=clippy-wasm cargo clippy --target wasm32-unknown-unknown -p plugin-factory -p tournament-engine -p tournament-cli -p tournament-web --no-default-features --lib --bins --tests --examples -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace
        language: system
        types: [rust]
        pass_filenames: false

      # the tests of the crates that also run in the browser, compiled to wasm and run in Node, or in
      # headless Chrome for tournament-web, which needs a browser (Chrome and chromedriver); doc
      # tests are compiled for wasm, but only run natively. Too slow for every commit, so it only
      # runs in CI or on request: `prek run --all-files --stage manual wasm-test`
      - id: wasm-test
        name: wasm test
        entry: sh -c 'wasm-pack test --node plugin-factory --profile wasm-test && wasm-pack test --node tournament-engine --profile wasm-test && wasm-pack test --node tournament-cli --profile wasm-test --no-default-features && wasm-pack test --headless --chrome tournament-web --profile wasm-test'
        language: system
        types: [rust]
        pass_filenames: false
        stages: [manual]

      - id: cargo-doc
        name: cargo doc
        entry: env RUSTDOCFLAGS=-Dwarnings cargo doc --workspace --no-deps
        language: system
        types: [rust]
        pass_filenames: false
  - repo: https://github.com/DevinR528/cargo-sort
    rev: v2.1.4
    hooks:
      - id: cargo-sort
  - repo: https://github.com/pre-commit/pre-commit-hooks  # Enables fast path
    rev: v6.0.0  # Used for the manifest and fallback, not fast-path detection
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: end-of-file-fixer
      - id: fix-byte-order-marker
      - id: check-json
      - id: check-toml
      - id: check-vcs-permalinks
      - id: check-yaml
      - id: check-xml
      - id: mixed-line-ending
      - id: check-symlinks
      - id: destroyed-symlinks
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-shebang-scripts-are-executable
      - id: check-executables-have-shebangs
