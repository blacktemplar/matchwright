# Throwaway spikes comparing GUI frameworks, see README.md. A workspace of its own, so that the
# frameworks stay out of the main workspace and its hooks.
[workspace]
members = ["spike-core", "spike-dioxus", "spike-leptos"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
console_error_panic_hook = "0.1.7"
dioxus = { version = "0.7", features = ["web"] }
getrandom = "0.4.3"
leptos = { version = "0.8", features = ["csr"] }
plugin-factory = { path = "../plugin-factory" }
serde_json = "1.0.154"
spike-core = { path = "spike-core" }
tournament-cli = { path = "../tournament-cli", default-features = false }
tournament-engine = { path = "../tournament-engine" }
uuid = { version = "1.28.0", features = ["v4"] }
wasm-bindgen-test = "0.3.79"
web-time = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
