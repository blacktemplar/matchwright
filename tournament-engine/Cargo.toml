[package]
name = "tournament-engine"
description = "Runs tournaments of pluggable formats, rankings and metrics, every change a logged transition that can be undone"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../README.md"
keywords = ["tournament", "competition", "bracket", "round-robin", "elimination"]
categories = ["algorithms", "games"]

[dependencies]
dyn-clone.workspace = true
indexmap.workspace = true
itertools.workspace = true
plugin-factory.workspace = true
rand.workspace = true
rand_seeder.workspace = true
rustc-hash.workspace = true
serde.workspace = true
thiserror.workspace = true
typetag.workspace = true
undoable-state-machine.workspace = true
uuid.workspace = true
vec1.workspace = true

[dev-dependencies]
postcard.workspace = true
# a test plays a tournament from a random seed
rand = { workspace = true, features = ["thread_rng"] }
serde_json.workspace = true
# the tests, benchmarks and examples of this crate build plugins directly
tournament-engine = { workspace = true, features = ["test-util"] }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
criterion.workspace = true

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
# the log ids and some seeds are random, and in the browser randomness comes from JavaScript, which
# the application picks, so the tests do
getrandom = { workspace = true, features = ["wasm_js"] }
uuid = { workspace = true, features = ["js"] }
wasm-bindgen-test.workspace = true

[features]
# Constructors building plugins and `PhasePlugins` directly, bypassing their configuration. Meant
# for tests: production code configures plugins through a draft, which also adds the plugins they
# imply.
test-util = []

[[bench]]
name = "large_tournament"
harness = false
