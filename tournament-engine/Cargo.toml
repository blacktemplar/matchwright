[package]
name = "tournament-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
dyn-clone.workspace = true
indexmap.workspace = true
itertools.workspace = true
plugin-factory.workspace = true
rand.workspace = true
rand_seeder.workspace = true
rustc-hash.workspace = true
serde.workspace = true
thiserror.workspace = true
typetag.workspace = true
undoable-state-machine.workspace = true
uuid.workspace = true
vec1.workspace = true

[dev-dependencies]
criterion.workspace = true
postcard.workspace = true
serde_json.workspace = true
# the tests, benchmarks and examples of this crate build plugins directly
tournament-engine = { workspace = true, features = ["test-util"] }

[features]
# Constructors building plugins and `PhasePlugins` directly, bypassing their configuration. Meant
# for tests: production code configures plugins through a draft, which also adds the plugins they
# imply.
test-util = []

[[bench]]
name = "large_tournament"
harness = false
