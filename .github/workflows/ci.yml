name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          # for the cargo-clippy-wasm hook
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files --skip cargo-fmt

  # the tests compiled to wasm, which are too slow for a hook on every commit (Node, Chrome and
  # chromedriver come with the runner image)
  wasm-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      # the runner image keeps chromedriver off the PATH, in the directory this variable names
      - run: echo "$CHROMEWEBDRIVER" >> "$GITHUB_PATH"
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files --stage manual wasm-test

  # the end-to-end tests of the page in headless Chrome, both of which come with the runner image
  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: trunk
      # the tools trunk downloads, i.e. the wasm-bindgen of the version Cargo.lock pins
      - uses: actions/cache@v6
        with:
          path: ~/.cache/trunk
          key: trunk-${{ hashFiles('Cargo.lock') }}
          restore-keys: trunk-
      # the chromedriver of the runner image, which matches its Chrome, rather than one the tests
      # would download
      - run: echo "E2E_CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files --stage manual web-e2e
      # a screenshot and a report on the page of each failed test; the tests of the harness fail on
      # purpose, so theirs are left out
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-failures
          path: |
            target/e2e-failures
            !target/e2e-failures/harness

  # the end-to-end tests of the GUI in headless Chrome, as web-e2e, on the page built by dx
  gui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # of the version of dioxus in Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      - run: echo "E2E_CHROMEDRIVER=$CHROMEWEBDRIVER/chromedriver" >> "$GITHUB_ENV"
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files --stage manual gui-e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: gui-e2e-failures
          path: target/e2e-failures

  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - uses: j178/prek-action@5337cb91e0fa35a7ff31b9ca345126d8bbbcdf16 # v2.0.6
        with:
          extra-args: --all-files cargo-fmt

  # the GUI on GitHub Pages, at blacktemplar.github.io/matchwright/ (hence the base path), built
  # here, since the wasm holds the absolute paths of the sources of its assets; after every push to
  # main that passes the jobs above
  pages-build:
    if: github.event_name == 'push'
    needs: [test, wasm-test, web-e2e, gui-e2e, fmt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: dioxus-cli@0.7.10
      # the media owner the help names, from the repository variable (Settings → Secrets and
      # variables → Actions → Variables), so that it is not in the code
      - run: dx build -p tournament-gui --release --debug-symbols false --base-path matchwright
        env:
          MATCHWRIGHT_MEDIA_OWNER: ${{ vars.MEDIA_OWNER }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: target/dx/tournament-gui/release/web/public

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # one deployment at a time, never stopped halfway; of those waiting, only the last runs
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
