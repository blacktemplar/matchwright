[package]
name = "e2e-harness"
description = "Runs end-to-end tests of a page built into a directory, in headless Chrome"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
axum.workspace = true
dirs.workspace = true
futures-util.workspace = true
reqwest = { workspace = true, features = ["rustls"] }
serde_json.workspace = true
sha2.workspace = true
# a directory of each test's own for what the browser downloads
tempfile.workspace = true
# Chrome's DevTools, which tell whether the page can be installed
thirtyfour = { workspace = true, features = ["cdp"] }
tokio = { workspace = true, features = ["fs", "net", "rt", "sync", "time"] }
tower-http = { workspace = true, features = ["fs"] }
