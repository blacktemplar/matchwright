[workspace]
members = [
    "e2e-harness",
    "plugin-factory",
    "plugin-factory-derive",
    "tournament-app",
    "tournament-browser",
    "tournament-cli",
    "tournament-engine",
    "tournament-gui",
    "tournament-gui-e2e",
    "tournament-web",
    "tournament-web-e2e",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/blacktemplar/matchwright"

# Dependency versions live here so that every member resolves to the same one, and a bump is a
# single edit.
[workspace.dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
criterion = "0.8.2"
# `dx`, its CLI that builds the GUI, has to be of the same version
dioxus = "0.7.10"
# the icons and the primitives of the components `dx components add` copies into tournament-gui;
# the primitives are unreleased, so `Cargo.lock` pins the commit
dioxus-icons = { version = "0.1.0", default-features = false }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dirs = "7.0.0"
dyn-clone = "1.0.20"
e2e-harness = { path = "e2e-harness" }
fluent-bundle = "0.16.0"
# of the version fluent-bundle parses with, for reading the messages of its resources
fluent-syntax = "0.12.0"
futures-channel = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.4.3"
# IndexedDB, the browser's database
idb = "0.6.5"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
itertools = "0.15.0"
js-sys = "0.3.106"
plugin-factory = { path = "plugin-factory" }
postcard = { version = "1.1.3", features = ["use-std"] }
# without the default features, which draw from the operating system: the engine only uses seeded
# generators, and so builds for targets that have no source of randomness
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
rand_seeder = "0.5.0"
reqwest = { version = "0.13.5", default-features = false }
rustc-hash = "2.1.3"
rustyline = "19.0.0"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
shlex = "2.0.1"
tempfile = "3.27.0"
# a client of WebDriver that starts the driver itself (`manager`), downloading it if needed, and
# speaks WebDriver BiDi (`bidi`), which is what tells about the browser asking whether to leave a page
thirtyfour = { version = "0.38.1", default-features = false, features = [
    "bidi",
    "manager",
    "rustls",
] }
thiserror = "2.0.21"
tokio = "1.54.1"
tournament-app = { path = "tournament-app" }
tournament-browser = { path = "tournament-browser" }
# without the default feature `terminal`, which only the binary of the CLI needs
tournament-cli = { path = "tournament-cli", default-features = false }
tournament-engine = { path = "tournament-engine" }
tower-http = "0.7.1"
typetag = "0.2.23"
undoable-state-machine = { git = "https://github.com/blacktemplar/undoable-state-machine", tag = "v0.1.0", features = [
    "serde",
] }
# of the version fluent-bundle takes languages in
unic-langid = "0.9.6"
# splits a letter from its accents, so that a search ignores them
unicode-normalization = "0.1.26"
uuid = { version = "1.29.0", features = ["v5", "serde"] }
vec1 = { version = "1.12.1", features = ["serde"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
wasm-bindgen-test = "0.3.79"
web-sys = "0.3.106"

# Profiles are only honoured in the workspace root, so they stay here rather than in a member.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The tests compiled to wasm (the `wasm-test` hook). Debug info makes every test binary several
# times larger, and preparing it for the test runner takes correspondingly longer.
[profile.wasm-test]
inherits = "dev"
debug = false

# The GUI's page, which `dx build --release` builds with this profile (without it, dx makes one of
# `release` with `opt-level = "s"`). Optimising the whole program at once makes the wasm smaller
# (under 1 MB with gzip) and, at this opt-level, about as fast as `release`; it takes longer to
# build. "z" is smaller still, but more than twice as slow.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The GUI's page for its end-to-end tests (`dx build --profile wasm-e2e`), built in seconds rather
# than the best part of a minute. dx counts a profile not inheriting `release` as debug, so it skips
# wasm-opt; without debug assertions the page leaves out dioxus-web's devtools client, which would
# try to reach `dx serve`.
[profile.wasm-e2e]
inherits = "dev"
opt-level = 1
debug = false
debug-assertions = false
strip = true
