[package]
name = "tournament-engine"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
rand_seeder = "0.5.0"
thiserror = "2.0.20"
undoable-state-machine = { git = "https://github.com/blacktemplar/undoable-state-machine" }
uuid = { version = "1.26.1", features = ["v5"] }
vec1 = "1.12.1"
itertools = "0.15.0"
dyn-clone = "1.0.20"
rustc-hash = "2.1.3"

[dev-dependencies]
criterion = "0.8.2"

[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

[[bench]]
name = "large_tournament"
harness = false
