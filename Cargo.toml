[workspace]
members = [
    "plugin-factory",
    "plugin-factory-derive",
    "tournament-cli",
    "tournament-engine",
    "tournament-web",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Dependency versions live here so that every member resolves to the same one, and a bump is a
# single edit.
[workspace.dependencies]
clap = { version = "4.6.7", features = ["derive"] }
console_error_panic_hook = "0.1.7"
criterion = "0.8.2"
dyn-clone = "1.0.20"
getrandom = "0.4.3"
indexmap = { version = "2.14.2", features = ["serde"] }
inquire = "0.9.4"
itertools = "0.15.0"
js-sys = "0.3.106"
plugin-factory = { path = "plugin-factory" }
postcard = { version = "1.1.3", features = ["use-std"] }
# without the default features, which draw from the operating system: the engine only uses seeded
# generators, and so builds for targets that have no source of randomness
rand = { version = "0.10.3", default-features = false, features = ["std", "std_rng"] }
rand_seeder = "0.5.0"
rustc-hash = "2.1.3"
rustyline = "19.0.0"
serde = "1.0.229"
serde_json = "1.0.154"
shlex = "2.0.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
# without the default feature `terminal`, which only the binary of the CLI needs
tournament-cli = { path = "tournament-cli", default-features = false }
tournament-engine = { path = "tournament-engine" }
typetag = "0.2.23"
undoable-state-machine = { git = "https://github.com/blacktemplar/undoable-state-machine", features = [
    "serde",
] }
uuid = { version = "1.28.0", features = ["v5", "serde"] }
vec1 = { version = "1.12.1", features = ["serde"] }
wasm-bindgen = "0.2.129"
wasm-bindgen-test = "0.3.79"
web-sys = "0.3.106"

# Profiles are only honoured in the workspace root, so they stay here rather than in a member.
[profile.release-checked]
inherits = "release"
debug-assertions = true
overflow-checks = true

# The tests compiled to wasm (the `wasm-test` hook). Debug info makes every test binary several
# times larger, and preparing it for the test runner takes correspondingly longer.
[profile.wasm-test]
inherits = "dev"
debug = false
